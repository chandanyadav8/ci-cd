spring:
  application:
    name: geo-tracking-service

  datasource:
    url: jdbc:postgresql://localhost:5432/geo_tracking
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

redis:
   host: localhost
   port: 6379